<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Dört Cephe</title>
<script type="importmap">{"imports":{"three":"../three.min.js"}}</script>
<link rel="stylesheet" href="lobby.css?v=20261107d">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0d1a26;color:#f0e8d6;font-family:Georgia,'Times New Roman',serif;touch-action:none;user-select:none;-webkit-user-select:none}
#game,#ov{position:fixed;inset:0;width:100%;height:100%;display:block}
#ov{pointer-events:none}
#hud{position:fixed;inset:0;pointer-events:none}
#hud button{pointer-events:auto;font:600 13px Georgia,serif;color:#f6ecd4;background:rgba(20,28,38,.86);border:1px solid #7f8fa0;border-radius:7px;cursor:pointer}
#hud button:disabled{opacity:.45}
#hud button.on{background:#b8862c;border-color:#ffd98a;color:#1a1206}
#money{position:absolute;left:10px;top:calc(8px + env(safe-area-inset-top,0px));padding:6px 12px;background:rgba(20,28,38,.86);border-radius:7px;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
#rivals{position:absolute;left:10px;top:calc(52px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:4px;width:150px}
#rivals button{text-align:left;padding:4px 7px;border-left-width:5px}
#rivals button.dead{opacity:.45;text-decoration:line-through}
#rivals i{display:block;height:4px;margin-top:3px;background:#62c98f}
#bar{position:absolute;left:0;right:0;bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;justify-content:center;gap:12px;padding:0 8px}
.grp{display:flex;gap:5px;align-items:stretch;flex-wrap:wrap;justify-content:center}
.grp span{align-self:center;font-size:12px;letter-spacing:1px;color:#d8cfb8;text-shadow:0 1px 2px #000}
.grp button{min-width:62px;padding:6px 7px;line-height:1.2}
.grp small{display:block;font-size:11px;color:#ffd98a}
.grp button.on small{color:#1a1206}
#tools{position:absolute;right:8px;top:calc(8px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:stretch;gap:4px;width:max-content}
#tools button{padding:3px 7px;font-size:11px;line-height:1.2;border-radius:5px;opacity:.85}
#eye{position:fixed;right:10px;bottom:calc(120px + env(safe-area-inset-bottom,0px));z-index:6;width:42px;height:42px;font-size:18px;color:#fff;background:rgba(20,28,38,.7);border:1px solid #7f8fa0;border-radius:50%;cursor:pointer}
#tip{position:absolute;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:60vw;padding:6px 12px;border-radius:7px;background:rgba(20,28,38,.86);text-align:center;font-size:14px}
#sesP{position:absolute;right:76px;top:calc(8px + env(safe-area-inset-top,0px));pointer-events:auto;display:flex;flex-direction:column;gap:6px;padding:9px 12px;background:rgba(20,28,38,.9);border-radius:7px;font-size:14px}
#sel{position:absolute;display:flex;gap:5px;transform:translate(-50%,-120%)}
#sel button{padding:7px 9px}
body.nohud #hud,body.nohud #ov{display:none}
#tabs{display:none}
#aimBar,#ask{position:absolute;left:50%;top:calc(52px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:flex;gap:10px;align-items:center;padding:9px 14px;border-radius:8px;background:rgba(150,32,20,.93);border:2px solid #ffd98a;font-size:16px;font-weight:700;white-space:nowrap;pointer-events:auto}
#ask{background:rgba(20,62,44,.95);top:calc(100px + env(safe-area-inset-top,0px))}
#aimBar button,#ask button{padding:6px 10px}
#aimBar[hidden],#ask[hidden]{display:none}
#ver{position:fixed;right:8px;top:calc(76px + env(safe-area-inset-top,0px));font:11px Georgia,serif;color:#fff;opacity:.6;text-shadow:0 1px 2px #000;pointer-events:none;z-index:7}
@media(max-width:760px){
  #rivals{width:104px;font-size:11px}#rivals button{padding:2px 5px}#money{font-size:16px;padding:4px 9px}#rivals{top:calc(42px + env(safe-area-inset-top,0px))}
  #bar{flex-direction:column;align-items:stretch;gap:4px;bottom:calc(4px + env(safe-area-inset-bottom,0px))}
  #tabs{display:flex;gap:4px}#tabs button{flex:1;padding:6px;font-size:13px}
  body[data-tab=d] #tabD,body[data-tab=a] #tabA{background:#b8862c;color:#1a1206;border-color:#ffd98a}
  body[data-tab=d] #gTgt,body[data-tab=d] #gAtk,body[data-tab=a] #gDef{display:none}
  .grp{flex-wrap:wrap;justify-content:stretch;gap:4px}.grp span{display:none}
  .grp button{flex:1 1 22%;min-width:0;padding:4px 3px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.grp small{font-size:10px}
  #tools button{padding:3px 6px;font-size:10px}
  #aimBar,#ask{font-size:13px;padding:7px 9px;max-width:92vw;white-space:normal}
  #eye{width:36px;height:36px;font-size:15px;bottom:auto;top:calc(96px + env(safe-area-inset-top,0px))}
}
</style>
</head>
<body>
<canvas id="game"></canvas><canvas id="ov"></canvas>
<div id="hud" hidden>
  <div id="money"></div>
  <div id="rivals"></div>
  <div id="tip" hidden></div>
  <div id="sesP" hidden></div>
  <div id="tools"><button id="bSes" data-en="Sound">Ses</button><button id="bHome" data-en="My base">Üssüm</button><button id="bAll" data-en="Whole map">Tüm harita</button></div>
  <div id="aimBar" hidden><span id="aimTxt"></span><button id="aimX" data-en="Cancel">Vazgeç</button></div>
  <div id="ask" hidden><span id="askT"></span><button id="askY" data-en="Accept">Kabul</button><button id="askN" data-en="Decline">Reddet</button></div>
  <div id="sel" hidden><button id="bUp"></button><button id="bSell"></button></div>
  <div id="bar">
    <div id="tabs"><button id="tabD" data-en="Defense">Savunma</button><button id="tabA" data-en="Attack">Saldırı</button></div>
    <div class="grp" id="gDef"><span data-en="DEFENSE">SAVUNMA</span></div>
    <div class="grp" id="gTgt"><span data-en="TARGET">HEDEF</span></div>
    <div class="grp" id="gAtk"><span data-en="SEND">GÖNDER</span></div>
  </div>
</div>
<button id="eye" title="Ekranı gizle" aria-label="Ekranı gizle" hidden>👁</button>

<div id="ver" data-en="Version 8">Sürüm 8</div>
<div id="lobby"><div class="lbox">
  <h1 data-en="FOUR FRONTS">DÖRT CEPHE</h1>
  <div id="lLang"><button data-l="tr">Türkçe</button><button data-l="en">English</button></div>
  <p class="sub" id="lSub">Herkese 200 para. Kuleni koru, rakiplerine asker gönder. Son ayakta kalan kazanır.</p>
  <div id="lMode"><button id="m4" class="on" data-en="4 players">4 kişilik</button><button id="m2">1v1</button></div>
  <div id="lHome">
    <label for="lName" data-en="Your name">Adın</label>
    <input id="lName" maxlength="12" autocomplete="off">
    <button id="lPlay" class="go">OYNA</button>
    <button id="lBots">Yapay zekaya karşı oyna</button>
    <button id="lInvite">Arkadaşlarınla oyna</button>
  </div>
  <div id="lQueue" hidden>
    <p id="lStatus">Rakip aranıyor…</p>
    <div id="lList"></div>
    <div id="lShare" hidden><input id="lLink" readonly aria-label="Davet linki"><button id="lCopy" data-en="Copy link">Linki kopyala</button></div>
    <button id="lStart" class="go" hidden data-en="Start match">Maçı başlat</button>
    <button id="lCancel" data-en="Cancel">Vazgeç</button>
  </div>
  <p id="lErr" hidden></p>
</div></div>
<div id="arenaEnd" hidden><div class="lbox"><h1 id="aeTitle"></h1><p class="sub" id="aeText"></p><button id="aeAgain" class="go" data-en="New match">Yeni maç</button><button id="aeWatch" data-en="Watch the match">Maçı izle</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="lobby.js?v=20261107d"></script>
</body>
</html>
