<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Dört Cephe</title>
<script type="importmap">{"imports":{"three":"../three.min.js"}}</script>
<link rel="stylesheet" href="lobby.css">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0d1a26;color:#f0e8d6;font-family:Georgia,'Times New Roman',serif;touch-action:none;user-select:none;-webkit-user-select:none}
#game,#ov{position:fixed;inset:0;width:100%;height:100%;display:block}
#ov{pointer-events:none}
#hud{position:fixed;inset:0;pointer-events:none}
#hud button{pointer-events:auto;font:600 13px Georgia,serif;color:#f6ecd4;background:rgba(20,28,38,.86);border:1px solid #7f8fa0;border-radius:7px;cursor:pointer}
#hud button:disabled{opacity:.45}
#hud button.on{background:#b8862c;border-color:#ffd98a;color:#1a1206}
#money{position:absolute;left:10px;top:calc(8px + env(safe-area-inset-top,0px));padding:6px 12px;background:rgba(20,28,38,.86);border-radius:7px;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
#rivals{position:absolute;left:10px;top:calc(52px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:4px;width:150px}
#rivals button{text-align:left;padding:4px 7px;border-left-width:5px}
#rivals button.dead{opacity:.45;text-decoration:line-through}
#rivals i{display:block;height:4px;margin-top:3px;background:#62c98f}
#bar{position:absolute;left:0;right:0;bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;justify-content:center;gap:12px;padding:0 8px}
.grp{display:flex;gap:5px;align-items:stretch;flex-wrap:wrap;justify-content:center}
.grp span{align-self:center;font-size:12px;letter-spacing:1px;color:#d8cfb8;text-shadow:0 1px 2px #000}
.grp button{min-width:62px;padding:6px 7px;line-height:1.2}
.grp small{display:block;font-size:11px;color:#ffd98a}
.grp button.on small{color:#1a1206}
#tools{position:absolute;right:10px;top:calc(8px + env(safe-area-inset-top,0px));display:flex;gap:6px}
#tools button{padding:7px 10px}
#eye{position:fixed;right:10px;bottom:calc(120px + env(safe-area-inset-bottom,0px));z-index:6;width:42px;height:42px;font-size:18px;color:#fff;background:rgba(20,28,38,.7);border:1px solid #7f8fa0;border-radius:50%;cursor:pointer}
#tip{position:absolute;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:60vw;padding:6px 12px;border-radius:7px;background:rgba(20,28,38,.86);text-align:center;font-size:14px}
#sesP{position:absolute;right:10px;top:calc(50px + env(safe-area-inset-top,0px));pointer-events:auto;display:flex;flex-direction:column;gap:6px;padding:9px 12px;background:rgba(20,28,38,.9);border-radius:7px;font-size:14px}
#sel{position:absolute;display:flex;gap:5px;transform:translate(-50%,-120%)}
#sel button{padding:7px 9px}
body.nohud #hud,body.nohud #ov{display:none}
@media(max-width:620px){#rivals{width:118px;font-size:12px}.grp span{width:100%;text-align:center}.grp button{min-width:54px}#eye{bottom:calc(164px + env(safe-area-inset-bottom,0px))}}
</style>
</head>
<body>
<canvas id="game"></canvas><canvas id="ov"></canvas>
<div id="hud" hidden>
  <div id="money"></div>
  <div id="rivals"></div>
  <div id="tip" hidden></div>
  <div id="sesP" hidden></div>
  <div id="tools"><button id="bSes">Ses</button><button id="bHome">Üssüm</button><button id="bAll">Tüm harita</button></div>
  <div id="sel" hidden><button id="bUp"></button><button id="bSell"></button></div>
  <div id="bar">
    <div class="grp" id="gDef"><span>SAVUNMA</span></div>
    <div class="grp" id="gTgt"><span>HEDEF</span></div>
    <div class="grp" id="gAtk"><span>GÖNDER</span></div>
  </div>
</div>
<button id="eye" title="Ekranı gizle" aria-label="Ekranı gizle" hidden>👁</button>

<div id="lobby"><div class="lbox">
  <h1>DÖRT CEPHE</h1>
  <p class="sub">Herkese 100 para. Kuleni koru, rakiplerine asker gönder. Son ayakta kalan kazanır.</p>
  <div id="lHome">
    <label for="lName">Adın</label>
    <input id="lName" maxlength="12" autocomplete="off">
    <button id="lPlay" class="go">OYNA</button>
    <button id="lBots">Yapay zekaya karşı oyna</button>
    <button id="lInvite">Arkadaşlarınla oyna</button>
  </div>
  <div id="lQueue" hidden>
    <p id="lStatus">Rakip aranıyor…</p>
    <div id="lList"></div>
    <div id="lShare" hidden><input id="lLink" readonly aria-label="Davet linki"><button id="lCopy">Linki kopyala</button></div>
    <button id="lStart" class="go" hidden>Maçı başlat</button>
    <button id="lCancel">Vazgeç</button>
  </div>
  <p id="lErr" hidden></p>
</div></div>
<div id="arenaEnd" hidden><div class="lbox"><h1 id="aeTitle"></h1><p class="sub" id="aeText"></p><button id="aeAgain" class="go">Yeni maç</button><button id="aeWatch">Maçı izle</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="lobby.js"></script>
</body>
</html>
